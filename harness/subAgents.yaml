# Agent roster. Keys are rungs on a capability ladder; project.yaml refers to
# them by key. `name` is the display name, `effort` the API parameter.
# Prices are USD per MTok. Cache writes are the 5-minute rate.
# spawnCost is USD, estimated: the floor for one spawn — assembled harness
# prompt in, minimal result out.

## Estimated/measured overhead values - anything that can be derived or looked up, and should be considered in budgets
estOutputFraction: 0.2
driverUsdPerStep: 1

agents:
  max:
    name: Fable 5.1 Max
    model: claude-fable-5-1
    effort: max
    inputUsdPerMTok: 10
    outputUsdPerMTok: 50
    cacheReadUsdPerMTok: 0.25
    cacheWriteUsdPerMTok: 12.5
    spawnCost: 0.21
    priceSource: https://platform.claude.com/docs/en/about-claude/pricing
    priceDate: "2026-09-12"

  high:
    name: Fable 5.1 Low
    model: claude-fable-5-1
    effort: low
    inputUsdPerMTok: 10
    outputUsdPerMTok: 50
    cacheReadUsdPerMTok: 0.25
    cacheWriteUsdPerMTok: 12.5
    spawnCost: 0.07
    priceSource: https://platform.claude.com/docs/en/about-claude/pricing
    priceDate: "2026-09-12"

  medium:
    name: Opus 5 High
    model: claude-opus-5
    effort: high
    inputUsdPerMTok: 5
    outputUsdPerMTok: 25
    cacheReadUsdPerMTok: 0.5
    cacheWriteUsdPerMTok: 6.25
    spawnCost: 0.06
    priceSource: https://platform.claude.com/docs/en/about-claude/pricing
    priceDate: "2026-09-12"

  low:
    name: Sonnet 5 High
    model: claude-sonnet-5
    effort: high
    inputUsdPerMTok: 2
    outputUsdPerMTok: 10
    cacheReadUsdPerMTok: 0.2
    cacheWriteUsdPerMTok: 2.5
    spawnCost: 0.02
    priceSource: https://platform.claude.com/docs/en/about-claude/pricing
    priceDate: "2026-09-12"
